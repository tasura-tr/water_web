<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>water_web</title>
</head>
<body>
    <h1>
        water_web
    </h1>
    <input type="text" id="urlber">
    <button onclick="get()">
        検索
    </button>
    <br>
    <div id="webbox">

    </div>
    <script>
        async function get () {
            let html = await fetch("https://script.google.com/macros/s/AKfycbzTS3Fa73imArOwjGPQlS-Eaii-rxaTPuWZFv68CoP7NbM2QfbtjCnfgVivrsANbrUe6w/exec?url=" + document.getElementById("urlber").value);
            html = await html.text();
            document.getElementById("webbox").innerHTML = html
        }
    </script>
</body>
</html>
